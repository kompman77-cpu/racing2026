<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Скачки 2026</title>
<style>
html,body{margin:0;height:100%;background:#100b08;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:'Segoe UI',Arial,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;gap:8px;align-items:stretch;z-index:5}
.chip{flex:1;background:rgba(24,16,8,.72);border:1px solid rgba(255,205,140,.35);color:#f3d9ae;border-radius:12px;padding:5px 4px;text-align:center;font-size:11px;letter-spacing:.06em}
.chip b{display:block;color:#fff;font-size:18px;margin-top:2px}
.hbtn{flex:0 0 auto;background:rgba(24,16,8,.72);border:1px solid rgba(255,205,140,.35);color:#ffe9c2;border-radius:12px;padding:10px 14px;font-size:16px;cursor:pointer}
.ov{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(16,10,4,.88);color:#fdf0dc;text-align:center;padding:24px}
.ov.on{display:flex}
.ov h1{margin:0;font-size:32px;letter-spacing:.12em;color:#ffd98a;text-shadow:0 2px 14px rgba(255,170,60,.45)}
.ov p{margin:0;max-width:560px;line-height:1.55;font-size:14px;color:#f3e2c4}
.big{background:#c17a1d;color:#fff;border:0;border-radius:12px;padding:14px 44px;font-size:18px;font-weight:700;letter-spacing:.1em;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
 <div class="chip">ОЧКИ<b id="hS">0</b></div>
 <div class="chip">ЭТАП<b id="hE">1</b></div>
 <div class="chip">МЕСТО<b id="hP">—</b></div>
 <button class="hbtn" id="bM">&#9834;</button>
 <button class="hbtn" id="bF">&#9974;</button>
</div>
<div id="menu" class="ov on">
 <h1>СКАЧКИ 2026</h1>
 <p>Три этапа. Приходите первым. Перепрыгивайте препятствия: тап по экрану — прыжок.</p>
 <button class="big" id="bGo">ПУСК</button>
</div>
<div id="ovS" class="ov"><h1 id="ovSh">ЭТАП ПРОЙДЕН</h1><p id="ovSp"></p><button class="big" id="bS">ДАЛЬШЕ</button></div>
<div id="ovO" class="ov"><h1 id="ovOh">ПОБЕДА!</h1><p id="ovOp"></p><button class="big" id="bO">ЗАНОВО</button></div>
<script>
'use strict';
const cv=document.getElementById('c'),X=cv.getContext('2d',{alpha:false});
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
let W=0,H=0,DPR=1,tNow=0;
let horizon=0,trackTop=0,laneH=0,trackBot=0;
const LANES=6,PL=3;
const FINISHES=[9000,27000,40000];
/* множитель скорости достигается К КОНЦУ заезда, старт всегда спокойный */
const SPEEDM=[1.2,2.0,3.0];
/* единица скорости: споткнулся — минус 1, чисто перепрыгнул — плюс 1 */
const UNIT=1;
/* сколько раз спотыкается каждая лошадь компьютера: этап 1 — 3, этап 2 — 2, этап 3 — 1 */
const PLAN=[3,2,1];
let FINISH=9000;
let camX=0,mode='menu',score=0,stage=1,prevPlace=6,cd=0,finList=[],finT=0;
let horses=[],hurdles=[],parts=[],shakeT=0;
let hitMeCnt=0,hitAiCnt=0;
let skyG=null,grassG=null,sunG=null,dirtG=null,vgG=null;
const CL=[{x:0.15,h:0.72,w:1.0,sp:0.010},{x:0.5,h:0.5,w:0.7,sp:0.016},{x:0.82,h:0.85,w:1.3,sp:0.007},{x:0.3,h:0.35,w:0.55,sp:0.021}];
let standTile=null;
function makeStand(){
 const t=document.createElement('canvas');t.width=256;t.height=120;
 const g=t.getContext('2d');
 const gg=g.createLinearGradient(0,0,0,120);
 gg.addColorStop(0,'#8a6f52');gg.addColorStop(1,'#6b543c');
 g.fillStyle=gg;g.fillRect(0,0,256,120);
 for(let r=0;r<6;r++){
  const y=18+r*18;
  g.fillStyle='rgba(0,0,0,0.25)';g.fillRect(0,y+11,256,3);
  for(let i=0;i<26;i++){
   const x=(i*10+(r%3)*4)%256;
   const hs=[[214,72,68],[70,120,190],[228,178,72],[96,158,110],[210,210,214],[168,96,170]];
   const c=hs[(i*7+r*3)%6];
   g.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+',0.85)';
   g.fillRect(x,y,6,7);g.fillRect(x+1,y-4,4,4);
  }
 }
 g.fillStyle='rgba(255,255,255,0.10)';
 for(let r=0;r<6;r++)g.fillRect(0,16+r*18,256,2);
 return t;
}
function resize(){
 DPR=Math.min(window.devicePixelRatio||1,2);
 W=cv.clientWidth;H=cv.clientHeight;
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
 X.setTransform(DPR,0,0,DPR,0,0);
 horizon=Math.round(H*0.44);
 trackTop=Math.round(H*0.47);
 laneH=Math.round((H*0.40)/LANES);
 trackBot=trackTop+laneH*LANES;
 skyG=X.createLinearGradient(0,0,0,horizon);
 skyG.addColorStop(0,'#7cc4ec');skyG.addColorStop(0.7,'#b6e0f4');skyG.addColorStop(1,'#dff2fa');
 grassG=X.createLinearGradient(0,trackBot,0,H);
 grassG.addColorStop(0,'#4f8a3d');grassG.addColorStop(1,'#2f5a28');
 sunG=X.createRadialGradient(W*0.78,horizon*0.35,4,W*0.78,horizon*0.35,H*0.5);
 sunG.addColorStop(0,'rgba(255,246,214,.55)');sunG.addColorStop(1,'rgba(255,246,214,0)');
 dirtG=X.createLinearGradient(0,trackTop,0,trackBot);
 dirtG.addColorStop(0,'#a87548');dirtG.addColorStop(0.5,'#96653f');dirtG.addColorStop(1,'#7c5232');
 vgG=X.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.85);
 vgG.addColorStop(0,'rgba(0,0,0,0)');vgG.addColorStop(1,'rgba(20,8,0,0.30)');
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,120));
function laneBase(i){return trackTop+(i+0.92)*laneH;}
function pickLanes(st){
 if(st===1)return[1];
 if(st===2)return[0,2,5];
 return[0,1,2,4,5];
}
function genHurdles(lane){
 const arr=[];
 const mult=SPEEDM[stage-1];
 const jd=(150+(stage-1)*7)*mult*1.15*0.75;
 const minGap=Math.round(jd*1.08+40);
 let x=rnd(420,520);
 let idx=0;
 while(x<FINISH-140){
  const p=x/FINISH;
  const wide=Math.random()<0.34;
  arr.push({x:x,wide:wide,spn:wide?140:10,broken:false,dec:false,done:false,idx:idx++});
  let g=(470-150*p)+rnd(-40,40);
  if(g<minGap+30)g=minGap+rnd(0,120);
  x+=g;
 }
 return arr;
}
/* масти: [корпус, грива/хвост]; игрок всегда белая */
const COATS=[['#5b3a1e','#2e1c0e'],['#1a1a20','#0b0b10'],['#8a4a1a','#5a2c0e'],['#9a9da4','#6b6e75'],['#3a2416','#1c0f08']];
const JACKETS=['#d84a3a','#2f6fd4','#2f9e44','#e8890c','#8e44ad','#d9b71a'];
function spawnHorses(){
 horses=[];
 FINISH=FINISHES[stage-1];
 hurdles=[];for(let i=0;i<LANES;i++)hurdles.push(genHurdles(i));
 /* база у всех строго одинаковая; игрок быстрее на 1 единицу */
 const B=150+(stage-1)*7;
 horses.push({lane:PL,me:true,x:120,s:B,bs:B,un:1,su:1,jy:0,vy:0,air:false,buffer:false,ph:Math.random()*6,st:0,
  coat:'#f4f4f6',mane:'#aeb2b9',jack:'#d84a3a',helm:'#f2f2f2'});
 const idx=[0,1,2,3,4].sort(()=>Math.random()-0.5);
 const lanes=pickLanes(stage);
 lanes.forEach((ln,i)=>{
  const ci=idx[i%5];
  const hh=hurdles[ln];
  /* план: каждое спотыкание привязано к случайному препятствию заезда */
  const plan=new Set();
  let tries=0;
  while(plan.size<Math.min(PLAN[stage-1],hh.length)&&tries<300){plan.add(Math.floor(Math.random()*hh.length));tries++;}
  horses.push({lane:ln,me:false,x:120+rnd(-18,10),s:B,bs:B,un:0,su:0,jy:0,vy:0,air:false,buffer:false,ph:Math.random()*6,st:0,
   plan:plan,react:rnd(0.36,0.55),
   coat:COATS[ci][0],mane:COATS[ci][1],jack:JACKETS[(i+1)%6],helm:'#f2f2f2'});
 });
 hitMeCnt=0;hitAiCnt=0;
}
function upd(){
 $('hS').textContent=score;
 $('hE').textContent=stage;
 const ps=horses.filter(h=>h.fin).sort((a,b)=>a.fin-b.fin);
 const p=horses[0];
 let pp=1;for(const h of horses)if(h!==p&&h.x>p.x)pp++;
 $('hP').textContent=p.fin?ps.findIndex(h=>h===p)+1:(mode==='play'?pp:'—');
}
function jump(h){
 if(h.air||h.st>0)return;
 h.air=true;h.vy=-600;
 if(h.me)sfxJump();
}
function step(dt){
 if(mode==='ready'){
  cd-=dt;
  if(cd<=0){mode='play';startCrowd(true);}
  return;
 }
 for(const h of horses){
  if(h.fin)continue;
  if(h.st>0)h.st-=dt;
  /* прыжок-физика */
  if(h.air){h.vy+=1600*dt;h.jy-=h.vy*dt;
   if(h.jy<=0){h.jy=0;h.air=false;
    if(h.buffer){h.buffer=false;if(h.st<=0)jump(h);}
    else if(h.me)parts.push({tp:'dust',x:h.x,y:0,life:1,dur:0.5,r:rnd(4,7)});
   }
  }
  h.x+=h.s*dt;
  /* скорость = (база + единицы) * разгон по ходу заезда.
     Пока лошадь споткнулась (st>0) — разгон заморожен и скорость падает.
     Единица не восстанавливается разгоном, только чистым прыжком. */
  const mult=1+(SPEEDM[stage-1]-1)*clamp(h.x/FINISH,0,1);
  const tgt=(h.bs+h.un*UNIT)*mult;
  if(h.st>0)h.s=Math.max(h.bs*0.5,h.s-260*dt);
  else h.s+=(tgt-h.s)*2.2*dt;
  h.ph+=dt*(h.s/16);
  /* барьеры: столкновение только с планками, промежуток широкого барьера — чистая дорожка */
  const hs=hurdles[h.lane];
  for(const b of hs){
   if(b.broken)continue;
   const px=h.x;
   const z2a=b.x+b.spn-10,z2b=b.x+b.spn;
   const hit=(px+18>=b.x&&px+2<=b.x+10)||(b.wide&&px+18>=z2a&&px+2<=z2b);
   if(hit){
    if(h.jy<14){
     b.broken=true;h.st=0.8;h.un=Math.max(h.un-1,-30);
     if(h.me){hitMeCnt++;sfxClat(1);shakeT=0.35;if(navigator.vibrate)navigator.vibrate(60);
      parts.push({tp:'wood',x:b.x,y:0,life:1,dur:0.7,r:3,lane:h.lane});
      parts.push({tp:'txt',x:b.x,y:-70,life:1,dur:1.0,s:'СКОРОСТЬ -1',c:'#ff5a4a',lane:PL});
     }else{hitAiCnt++;sfxClat(0.45);
      parts.push({tp:'wood',x:b.x,y:0,life:1,dur:0.7,r:3,lane:h.lane});
      parts.push({tp:'txt',x:b.x,y:-70,life:1,dur:1.2,s:'СПОТКНУЛАСЬ! -1',c:'#ffb37a',lane:h.lane});
     }
    }
   }
   const passed=px-6>b.x+b.spn;
   if(passed&&!b.done&&!b.broken){b.done=true;
    /* чистый прыжок: +1 единица, но не выше стартовой */
    if((h.jy>=14||!h.air)&&h.un<h.su)h.un+=1;
   }
  }
  if(!h.me&&!h.air&&h.st<=0){
   /* ИИ: прыжок рассчитан геометрически и срабатывает на любой скорости этапа.
      На препятствии из плана прыжка нет — лошадь гарантированно в него врезается.
      На остальных препятствиях она прыгает так, чтобы не задеть планки:
      узкое — верхом дуги над планкой, широкое — первый прыжок приземляется
      между планками, второй — сразу после приземления, перед дальней планкой. */
   let nb=null;
   for(const b of hs){if(!b.broken&&!b.done&&b.x+b.spn>h.x+16){nb=b;break;}}
   if(nb&&!h.plan.has(nb.idx)){
    if(nb.wide){
     if(!nb.dec){
      const tx1=nb.x+nb.spn*0.4-h.s*0.75;
      if(h.x>=tx1){nb.dec=true;jump(h);}
     }else if(h.x+18>nb.x+10){
      jump(h);
     }
    }else{
     if(h.x>=nb.x+5-h.s*0.375)jump(h);
    }
   }
  }
  if(h.x>=FINISH){h.fin=finList.length+1;finList.push(h);if(h.me)finT=0.9;}
 }
 /* обгоны */
 const p=horses[0];
 let pp=1;for(const h of horses)if(h.x>p.x)pp++;
 if(pp<prevPlace){score+=20*(prevPlace-pp);upd();
  parts.push({tp:'txt',x:p.x,y:-95,life:1,dur:1.1,s:'+'+(20*(prevPlace-pp)),c:'#ffd24a',lane:PL});}
 prevPlace=pp;
 camX=p.x-W*0.30;
 for(let i=parts.length-1;i>=0;i--){
  const q=parts[i];q.life-=dt/q.dur;
  if(q.life<=0){parts.splice(i,1);continue;}
  if(q.tp==='dust')q.r+=14*dt;
 }
 if(shakeT>0)shakeT-=dt;
 if(finT>0)finT-=dt;
 if(mode==='play'&&p.fin!==undefined&&finT<=0)endRace(p.fin);
 if(mode==='play'){
  galT-=dt*(p.s/150);
  if(galT<=0){galT=0.42;if(p.st<=0&&p.s>60)gallopBeat(0.55);}
 }
}
let galT=0;
function endRace(fp){
 mode='res';
 startCrowd(false);
 let pts=0,msg='';
 if(fp===1){pts=300;msg='Первое место! +300 очков. ';}
 else if(fp===2){pts=150;msg='Второе место. +150 очков. ';}
 else if(fp===3){pts=75;msg='Третье место. +75 очков. ';}
 else msg='Увы, за пределами призовой тройки. ';
 msg+='Спотыканий: у вас — '+hitMeCnt+', у соперников — '+hitAiCnt+'.';
 score+=pts;upd();
 if(stage>=3&&fp===1){
  mode='win';
  $('ovOh').textContent='ПОБЕДА!';
  $('ovOp').textContent='Вы выиграли все заезды. Итог: '+score+' очков';
  $('ovO').classList.add('on');
  fanfare(1);return;
 }
 if(fp===1){
  $('ovSh').textContent='ЭТАП ПРОЙДЕН';
  $('ovSp').textContent=msg+' Этап '+(stage+1)+' ждёт.';
 }else{
  $('ovSh').textContent='ЗАЕД ПРОИГРАН';
  $('ovSp').textContent=msg+' Попробуйте ещё раз — очки сохраняются.';
 }
 $('ovS').classList.add('on');
 fanfare(fp===1?0:2);
}
function drawHorse(h){
 const x=h.x-camX;
 if(x<-90||x>W+90)return;
 const base=laneBase(h.lane);
 const y=base-h.jy;
 const wob=h.st>0?Math.sin(tNow*34)*2.2:0;
 const shw=Math.max(0.35,1-h.jy/160);
 X.fillStyle='rgba(30,18,8,'+(0.28*shw).toFixed(3)+')';
 X.beginPath();X.ellipse(x,base+2,20*shw+4,4,0,0,Math.PI*2);X.fill();
 X.save();X.translate(x+wob,y);
 if(h.air)X.rotate(clamp(h.vy*0.0007,-0.42,0.42));
 X.lineCap='round';
 const ph=h.ph;
 X.lineWidth=3.4;
 X.strokeStyle=h.coat;
 if(h.air){
  X.beginPath();X.moveTo(12,-27);X.quadraticCurveTo(24,-18,32,-6);X.stroke();
  X.beginPath();X.moveTo(11,-25);X.quadraticCurveTo(21,-13,28,1);X.stroke();
  X.beginPath();X.moveTo(-12,-27);X.quadraticCurveTo(-26,-16,-32,-3);X.stroke();
  X.beginPath();X.moveTo(-11,-25);X.quadraticCurveTo(-23,-11,-29,2);X.stroke();
 }else{
  for(let i=0;i<4;i++){
   const bx=(i<2?12:-13)+(i%2?3:-3);
   const sw=Math.sin(ph*2+i*1.9)*9;
   const kx=bx+sw*0.35,ky=-15-Math.cos(ph*2+i*1.9)*2.5;
   X.beginPath();X.moveTo(bx,-24);X.quadraticCurveTo(kx,ky,bx+sw,-1);X.stroke();
  }
 }
 X.fillStyle=h.coat;
 X.beginPath();X.ellipse(0,-31,23,10,0.03,0,Math.PI*2);X.fill();
 X.beginPath();
 X.moveTo(15,-36);X.quadraticCurveTo(25,-44,29,-47);
 X.lineTo(37,-45);X.quadraticCurveTo(40,-42,36,-40);
 X.quadraticCurveTo(28,-38,20,-32);X.closePath();X.fill();
 X.strokeStyle=h.mane;X.lineWidth=2.6;
 X.beginPath();X.moveTo(16,-40);X.quadraticCurveTo(22,-47,27,-49);X.stroke();
 X.fillStyle=h.coat;
 X.beginPath();X.moveTo(28,-48);X.lineTo(30,-54);X.lineTo(33,-48);X.closePath();X.fill();
 X.fillStyle='#0a0a0a';X.beginPath();X.arc(34,-44,1.1,0,Math.PI*2);X.fill();
 X.strokeStyle=h.mane;X.lineWidth=4;
 X.beginPath();X.moveTo(-21,-34);
 X.quadraticCurveTo(-32,-30+Math.sin(ph*2)*3,-36,-18+Math.cos(ph*2)*2);
 X.stroke();
 const lean=h.air?7:Math.sin(ph)*1.5;
 X.save();X.translate(lean,0);
 X.fillStyle=h.jack;
 X.beginPath();X.ellipse(5,-45,6.5,5.5,0.25,0,Math.PI*2);X.fill();
 X.fillRect(1,-42,4,9);
 X.fillStyle='#2a2a2e';X.fillRect(1,-35,4,4);
 X.fillStyle=h.helm;X.beginPath();X.arc(9,-55,3.8,0,Math.PI*2);X.fill();
 X.fillStyle='#15151a';X.fillRect(5.6,-55.5,7,2.2);
 X.restore();
 X.restore();
 if(h.me){
  X.fillStyle='rgba(255,90,60,'+(0.5+0.3*Math.sin(tNow*5)).toFixed(3)+')';
  X.beginPath();X.arc(x,base+3,3.5,0,Math.PI*2);X.fill();
 }
}
function drawHurdles(){
 for(let i=0;i<LANES;i++){
  const base=laneBase(i);
  for(const b of hurdles[i]){
   const x=b.x-camX;
   if(x<-180||x>W+180)continue;
   const hy=base-14;
   if(b.broken){
    X.strokeStyle='rgba(120,90,60,0.9)';X.lineWidth=3;
    X.beginPath();X.moveTo(x-10,base-4);X.lineTo(x+16,base-10);X.stroke();
    X.beginPath();X.moveTo(x+2,base-2);X.lineTo(x+24,base-6);X.stroke();
    if(b.wide){
     X.beginPath();X.moveTo(x+b.spn-16,base-4);X.lineTo(x+b.spn+8,base-9);X.stroke();
    }
   }else if(b.wide){
    const sp=b.spn;
    X.strokeStyle='rgba(60,40,20,0.18)';X.lineWidth=4;
    X.beginPath();X.moveTo(x-2,base+1);X.lineTo(x+sp+14,base+1);X.stroke();
    X.strokeStyle='#e8e2d2';X.lineWidth=3.2;
    X.beginPath();X.moveTo(x-2,base);X.lineTo(x+2,hy);X.moveTo(x+14,base);X.lineTo(x+10,hy);
    X.moveTo(x+sp-2,base);X.lineTo(x+sp+2,hy);X.moveTo(x+sp+14,base);X.lineTo(x+sp+10,hy);X.stroke();
    X.lineWidth=5;
    const n=Math.max(4,Math.round(sp/9));
    for(let s=0;s<n;s++){
     X.strokeStyle=s%2?'#d84a3a':'#f2ede0';
     X.beginPath();X.moveTo(x+s*(sp/n),hy);X.lineTo(x+(s+1)*(sp/n),hy);X.stroke();
    }
    X.strokeStyle='rgba(120,90,60,0.9)';X.lineWidth=1.5;
    X.beginPath();X.moveTo(x-4,hy-4);X.lineTo(x+sp+16,hy-4);X.stroke();
   }else{
    X.strokeStyle='rgba(60,40,20,0.18)';X.lineWidth=4;
    X.beginPath();X.moveTo(x-2,base+1);X.lineTo(x+12,base+1);X.stroke();
    X.strokeStyle='#e8e2d2';X.lineWidth=3.2;
    X.beginPath();X.moveTo(x-2,base);X.lineTo(x+2,hy);
    X.moveTo(x+14,base);X.lineTo(x+10,hy);X.stroke();
    X.lineWidth=5;
    for(let s=0;s<4;s++){
     X.strokeStyle=s%2?'#d84a3a':'#f2ede0';
     X.beginPath();X.moveTo(x-3+s*5,hy);X.lineTo(x+s*5+3,hy);X.stroke();
    }
    X.strokeStyle='rgba(120,90,60,0.9)';X.lineWidth=1.5;
    X.beginPath();X.moveTo(x-4,hy-4);X.lineTo(x+16,hy-4);X.stroke();
   }
  }
 }
}
function draw(){
 X.fillStyle='#100b08';X.fillRect(0,0,W,H);
 const sh=shakeT>0?Math.sin(tNow*60)*3*shakeT:0;
 X.save();X.translate(sh,0);
 X.fillStyle=skyG;X.fillRect(0,0,W,horizon);
 X.fillStyle=sunG;X.fillRect(0,0,W,horizon);
 for(const c of CL){
  const px=(((c.x+tNow*c.sp)%1.3)-0.15)*W*1.3;
  X.fillStyle='rgba(255,255,255,0.8)';
  X.beginPath();X.ellipse(px,c.h*horizon,c.w*0.09*W,c.w*0.028*W,0,0,Math.PI*2);X.fill();
  X.beginPath();X.ellipse(px-c.w*0.05*W,c.h*horizon+4,c.w*0.05*W,c.w*0.02*W,0,0,Math.PI*2);X.fill();
 }
 if(standTile){
  const sy=horizon-120;
  const off=((camX*0.35)%256+256)%256;
  for(let x=-off;x<W;x+=256)X.drawImage(standTile,x,sy);
 }
 X.fillStyle='rgba(255,255,255,0.06)';X.fillRect(0,horizon-8,W,8);
 X.strokeStyle='rgba(250,245,235,0.8)';X.lineWidth=2;
 const fo=((camX*0.75)%90+90)%90;
 X.beginPath();X.moveTo(0,horizon-2);X.lineTo(W,horizon-2);X.stroke();
 for(let x=-fo;x<W;x+=90){X.beginPath();X.moveTo(x,horizon-2);X.lineTo(x,trackTop);X.stroke();}
 X.fillStyle=dirtG;X.fillRect(0,trackTop,W,trackBot-trackTop);
 /* дорожки — сплошные, чтобы не мерцали */
 for(let i=0;i<=LANES;i++){
  const y=trackTop+i*laneH;
  X.strokeStyle=i===PL||i===PL+1?'rgba(255,220,150,0.85)':'rgba(240,232,215,0.30)';
  X.lineWidth=1.6;
  X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke();
 }
 const fx=FINISH-camX;
 if(fx>-60&&fx<W+60){
  for(let i=0;i<LANES;i++){
   const y0=trackTop+i*laneH;
   for(let j=0;j<5;j++){
    X.fillStyle=j%2?'#1a1a1a':'#f2f2f2';
    X.fillRect(fx+j*9,y0,9,laneH/5);
    X.fillStyle=j%2?'#f2f2f2':'#1a1a1a';
    X.fillRect(fx+j*9,y0+laneH/5,9,laneH/5);
   }
  }
 }
 drawHurdles();
 const ord=horses.slice().sort((a,b)=>a.lane-b.lane);
 for(const h of ord)drawHorse(h);
 for(const q of parts){
  const a=Math.max(0,q.life);
  if(q.tp==='dust'){X.fillStyle='rgba(190,160,120,'+(0.5*a).toFixed(3)+')';X.beginPath();X.arc(q.x-camX,laneBase(horses[0].lane)-q.r*0.2,q.r,0,Math.PI*2);X.fill();}
  else if(q.tp==='wood'){X.fillStyle='rgba(190,140,90,'+a.toFixed(3)+')';X.fillRect(q.x-camX-3,laneBase(q.lane!==undefined?q.lane:PL)-20,7,14);}
  else if(q.tp==='txt'){X.font='700 '+Math.round(H*0.032)+'px Segoe UI,Arial';X.textAlign='center';
   X.globalAlpha=a;X.fillStyle=q.c;
   X.fillText(q.s,q.x-camX,laneBase(q.lane!==undefined?q.lane:PL)-laneH*0.5-(1-a)*30);X.globalAlpha=1;}
 }
 X.fillStyle=grassG;X.fillRect(0,trackBot,W,H-trackBot);
 X.restore();
 X.fillStyle=vgG;X.fillRect(0,0,W,H);
 if(mode==='ready'){
  X.fillStyle='rgba(16,10,4,0.45)';X.fillRect(0,0,W,H);
  const n=Math.ceil(cd);
  X.fillStyle='#ffd98a';X.font='900 '+Math.round(H*0.18)+'px Segoe UI,Arial';
  X.textAlign='center';X.fillText(n>0?n:'МАРШ!',W/2,H*0.42);
 }
}
function reset(){
 prevPlace=LANES+1;finList=[];finT=0;
 horses=[];hurdles=[];parts=[];camX=0;cd=3.2;
 spawnHorses();upd();
}
function stageClearGo(){
 const retry=$('ovSh').textContent==='ЗАЕД ПРОИГРАН';
 if(!retry)stage++;
 $('ovS').classList.remove('on');
 reset();mode='ready';
}
$('bGo').addEventListener('click',()=>{audio();reset();mode='ready';$('menu').classList.remove('on');});
$('bS').addEventListener('click',()=>{audio();stageClearGo();});
$('bO').addEventListener('click',()=>{
 audio();$('ovO').classList.remove('on');
 $('ovOh').textContent='ПОБЕДА!';
 stage=1;score=0;reset();mode='ready';
});
function doJump(){
 if(mode!=='play')return;
 const p=horses[0];
 if(p.fin!==undefined)return;
 if(p.air){p.buffer=true;return;}
 if(p.st>0)return;
 jump(p);
}
cv.addEventListener('pointerdown',doJump);
$('bM').addEventListener('click',()=>{musicOn=!musicOn;$('bM').style.opacity=musicOn?1:0.45;});
$('bF').addEventListener('click',()=>{
 if(document.fullscreenElement){if(document.exitFullscreen)document.exitFullscreen();}
 else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();
});
/* ===== ЗВУК ===== */
let AC=null,musicOn=true,mStep=0,mNext=0,noiseBuf=null,crowdG=null;
function audio(){
 if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
 if(AC){
  if(!noiseBuf){
   noiseBuf=AC.createBuffer(1,Math.floor(AC.sampleRate*1.0),AC.sampleRate);
   const d=noiseBuf.getChannelData(0);
   for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  if(AC.state==='suspended')AC.resume();
 }
 return AC;
}
function tone(f,t,d,type,vol,f2){
 const o=AC.createOscillator(),g=AC.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);
 if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
 o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.02);
}
function noiseB(t,d,vol,freq,type){
 const n=AC.createBufferSource();n.buffer=noiseBuf;
 const f=AC.createBiquadFilter(),g=AC.createGain();
 f.type=type||'bandpass';f.frequency.value=freq;
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
 n.connect(f);f.connect(g);g.connect(AC.destination);n.start(t);n.stop(t+d+0.02);
}
/* галоп «тыгыдын»: так-так-ДАН */
function gallopBeat(v){
 if(!AC||!musicOn)return;
 const t=AC.currentTime;
 noiseB(t,0.04,0.22*v,1300,'bandpass');
 tone(150,t,0.05,'sine',0.20*v,70);
 const t2=t+0.11;
 noiseB(t2,0.04,0.22*v,1100,'bandpass');
 tone(135,t2,0.05,'sine',0.20*v,70);
 const t3=t+0.24;
 noiseB(t3,0.06,0.34*v,900,'bandpass');
 tone(110,t3,0.09,'sine',0.38*v,45);
}
function sfxJump(){
 if(!audio())return;
 const t=AC.currentTime;
 noiseB(t,0.18,0.5,500,'bandpass');
 tone(300,t,0.2,'sine',0.25,90);
}
function sfxClat(v){
 if(!audio())return;
 v=v||1;
 const t=AC.currentTime;
 noiseB(t,0.12,0.9*v,2200,'bandpass');
 for(let i=0;i<3;i++)tone(rnd(700,1100),t+i*0.04,0.06,'square',0.3*v);
 tone(80,t,0.25,'sine',0.6*v,40);
}
function startCrowd(on){
 if(!audio())return;
 if(on&&!crowdG){
  const n=AC.createBufferSource();n.buffer=noiseBuf;n.loop=true;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=700;
  crowdG=AC.createGain();crowdG.gain.value=0;
  n.connect(f);f.connect(crowdG);crowdG.connect(AC.destination);n.start();
 }
 if(crowdG)crowdG.gain.linearRampToValueAtTime(on?0.05:0.0,AC.currentTime+0.6);
}
function fanfare(kind){
 if(!audio())return;
 const t=AC.currentTime;
 const seq=kind===1?[[523,0],[523,0.12],[587,0.24],[659,0.36],[784,0.5],[659,0.66],[784,0.82]]:
  (kind===0?[[659,0],[784,0.18],[988,0.36]]:[[392,0],[330,0.2],[262,0.4]]);
 for(const[nf,dt]of seq){tone(nf,t+dt,0.30,'square',0.16);tone(nf/2,t+dt,0.30,'triangle',0.12);}
}
function sched(){
 if(!AC||!musicOn||mode==='menu')return;
 if(mode!=='play'&&mode!=='ready')return;
 const bpm=stage>=3?148:(stage===2?136:126),spb=60/bpm/2;
 const roots=[65.41,98.0,110.0,87.31];
 const mel=[523,659,784,659,880,784,659,587];
 if(mNext<AC.currentTime)mNext=AC.currentTime+0.05;
 while(mNext<AC.currentTime+0.15){
  const s=mStep%16;
  const bar=Math.floor(mStep/16)%4;
  const root=roots[bar];
  if(s%2===0)tone(root,mNext,0.14,'sine',0.34);
  if(s%4===3)tone(root*2,mNext,0.10,'triangle',0.16);
  if(s%4===0)tone(150,mNext,0.12,'sine',0.5,50);
  if(s%2===1)noiseB(mNext,0.05,0.10,6000);
  if(s===0||s===3||s===6||s===10||s===12||s===14)tone(mel[(mStep+bar*3)%8],mNext,0.20,'triangle',0.11);
  mStep++;mNext+=spb;
 }
}
setInterval(sched,60);
let last=0;
function loop(ts){
 requestAnimationFrame(loop);
 const dt=Math.min(0.05,(ts-last)/1000);
 last=ts;tNow=ts/1000;
 if(dt>0){try{if(mode==='ready'||mode==='play')step(dt);}catch(e){}}
 try{draw();}catch(e){}
}
standTile=makeStand();
resize();
requestAnimationFrame(loop);
</script>
